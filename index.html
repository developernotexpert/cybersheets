<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="brand">
        <a href="#/" class="brand-link">
          <span class="brand-prompt">root@cyber</span><span class="brand-sep">:~$</span>
          <span class="brand-name">CyberSheets</span>
        </a>
      </div>

      <div class="search-box">
        <span class="search-icon">&#9906;</span>
        <input
          type="search"
          id="search-input"
          placeholder="search tool or text..."
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="search-kbd">/</kbd>
      </div>

      <nav id="nav"><!-- populated by JS --></nav>

      <div class="sidebar-footer">
        <span class="dot"></span> <span id="tool-count">0</span> tools
      </div>
    </aside>

    <!-- Mobile menu button -->
    <button id="menu-toggle" aria-label="Menu">&#9776;</button>

    <!-- Content -->
    <main id="content">
      <article id="markdown-body" class="markdown-body">
        <div class="loading">loading…</div>
        <noscript>
          <h1>CyberSheets — Cybersecurity &amp; Pentest Cheatsheets</h1>
          <p>CyberSheets is a searchable collection of command cheatsheets for cybersecurity,
             pentesting and cryptography — covering reconnaissance, port scanning, web fuzzing,
             exploitation, privilege escalation, password cracking, forensics, reverse engineering
             and more. Tools include Nmap, Masscan, ffuf, sqlmap, Burp Suite, Hashcat, John the Ripper,
             Hydra, Metasploit, Wireshark, tcpdump, Volatility, Ghidra, mimikatz, impacket and dozens more.</p>
          <p>This site needs JavaScript to browse and search interactively.
             The cheatsheets are Markdown files in the <code>tools/</code> directory of the repository.</p>
        </noscript>
      </article>
    </main>
    <div id="overlay"></div>
  </div>

  <!-- marked.js (render Markdown) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <!-- highlight.js (syntax highlighting in code blocks) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- MiniSearch (inverted-index search) — vendored locally, no CDN -->
  <script src="assets/vendor/minisearch.min.js"></script>
  <!-- App -->
  <script src="assets/js/app.js"></script>
