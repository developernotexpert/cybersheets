name: Validate contributions

# Runs on pull requests that touch cheatsheets or the build.
# Fails with a clear message if any .md has invalid front-matter,
# so contributors get instant feedback without running anything locally.

on:
  pull_request:
    paths:
      - "tools/**"
      - "build/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate front-matter and build
        run: node build/build-index.js --check
