name: Validate contributions

# Runs on every pull request targeting main, so it can be a reliable
# required status check. Fails with a clear message if any .md has
# invalid front-matter, giving contributors instant feedback.

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate front-matter and build
        run: node build/build-index.js --check
